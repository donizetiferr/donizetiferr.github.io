name: Public repository security
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'
permissions:
  contents: read
jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified scanner
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --output gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          printf '[extend]\nuseDefault = true\n' > "$RUNNER_TEMP/trusted-gitleaks.toml"
      - name: Scan all history and current files without exposing matches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags origin '+refs/heads/*:refs/remotes/origin/*'
          for mode in git dir; do
            args=("$mode" . --config "$RUNNER_TEMP/trusted-gitleaks.toml" --gitleaks-ignore-path "$RUNNER_TEMP/empty-ignore" --ignore-gitleaks-allow --redact=100 --no-banner --no-color)
            if [ "$mode" = git ]; then args+=(--log-opts='--all --full-history'); fi
            "$RUNNER_TEMP/gitleaks" "${args[@]}" 2>"$RUNNER_TEMP/scan-$mode.log"
            if grep -Eiq '\b(ERR|WRN|error|warning)\b' "$RUNNER_TEMP/scan-$mode.log"; then
              echo 'Secret scan incomplete; inspect privately. No report is published.'
              exit 1
            fi
          done
